# Builds the Windows programs (self-contained single-file exes) and the Android client APK, and publishes
# them as a GitHub Release when a version tag is pushed:
#   git tag v1.5.0 && git push origin v1.5.0
# Running the workflow manually (Actions tab > release > Run workflow) builds everything without publishing;
# the files are attached to the run as an artifact.
# The programs' built-in updater looks for these assets on the latest release.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Building version $v"

      - name: Run tests
        run: dotnet test tests/LinkTest.Tests -c Release

      - name: Publish Windows programs
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $apps = @(
            @{ Project = 'src/LinkTest.Client'; Asset = 'LinkTest-Client-win-x64.zip' },
            @{ Project = 'src/LinkTest.Server'; Asset = 'LinkTest-Server-win-x64.zip' },
            @{ Project = 'src/LinkTest.ServerGui'; Asset = 'LinkTest-ServerGui-win-x64.zip' },
            @{ Project = 'src/LinkTest.Cli';    Asset = 'LinkTest-Cli-win-x64.zip' }
          )
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($a in $apps) {
            $out = "publish/" + [IO.Path]::GetFileNameWithoutExtension($a.Asset)
            dotnet publish $a.Project -c Release -r win-x64 --self-contained `
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
              -p:Version=$version -o $out
            if ($LASTEXITCODE -ne 0) { throw "publish failed for $($a.Project)" }
            Compress-Archive -Path "$out/*" -DestinationPath "dist/$($a.Asset)" -Force
          }

      - name: Install .NET Android workload
        run: dotnet workload install maui-android

      - name: Build Android APK
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          $sdkmanager = Get-ChildItem "$sdk\cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1 -ExpandProperty FullName
          "y`ny`ny`n" | & $sdkmanager --sdk_root=$sdk "platforms;android-36" "build-tools;36.0.0" | Select-Object -Last 2
          $sign = @()
          if ($env:KEYSTORE_B64) {
            $ks = Join-Path $env:RUNNER_TEMP 'release.keystore'
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
            $sign = @('-p:AndroidKeyStore=true', "-p:AndroidSigningKeyStore=$ks", "-p:AndroidSigningKeyAlias=$env:KEY_ALIAS",
                      "-p:AndroidSigningKeyPass=$env:KEYSTORE_PASS", "-p:AndroidSigningStorePass=$env:KEYSTORE_PASS")
          } else {
            Write-Warning 'ANDROID_KEYSTORE_* secrets not set - APK is debug-signed and cannot update a release-signed install.'
          }
          dotnet publish src/LinkTest.Mobile -c Release -f net10.0-android -p:Version=$version `
            "-p:AndroidSdkDirectory=$sdk" "-p:JavaSdkDirectory=$env:JAVA_HOME" @sign -o publish/android
          if ($LASTEXITCODE -ne 0) { throw 'Android publish failed' }
          $apk = Get-ChildItem publish/android -Filter '*-Signed.apk' | Select-Object -First 1
          if (-not $apk) { throw 'signed APK not found' }
          Copy-Item $apk.FullName dist/LinkTest-Client-android.apk
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v5
        with:
          name: linktest-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Create release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's section of CHANGELOG.md (falls back to GitHub's generated notes).
          $v = '${{ steps.ver.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## \[?$([regex]::Escape($v))\]?" })
          if ($start -ge 0) {
            $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^## ' })
            if ($end -lt 0) { $end = $lines.Length }
            $lines[($start + 1)..($end - 1)] -join "`n" | Set-Content notes.md
            gh release create '${{ github.ref_name }}' dist/* --title 'LinkTest ${{ github.ref_name }}' --notes-file notes.md
          } else {
            gh release create '${{ github.ref_name }}' dist/* --title 'LinkTest ${{ github.ref_name }}' --generate-notes
          }
