# Builds the Windows programs and runs the automated tests on every push and pull request.
# (The Android app is built by the release workflow.)
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          foreach ($p in 'src/LinkTest.Client','src/LinkTest.Server','src/LinkTest.ServerGui','src/LinkTest.Cli','tests/LinkTest.Tests') {
            dotnet build $p -c Release
            if ($LASTEXITCODE -ne 0) { throw "build failed: $p" }
          }

      - name: Test
        run: dotnet test tests/LinkTest.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results
